services:
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:myPostgres@host.docker.internal:5432/postgres-crud
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: iftekhar
      POSTGRES_PASSWORD: myPostgres
      POSTGRES_DB: postgres-crud

    ports:
      -"5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
networks:
